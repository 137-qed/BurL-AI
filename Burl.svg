<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="BurL AI logo">
  <!-- Load Iceberg from Google Fonts -->
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Iceberg&display=swap');

    .logo {
      font-family: 'Iceberg', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      font-size: 160px;
      fill: #00FF7F; /* computational green */
      letter-spacing: 2px;
    }

    /* fallback if the font fails to load: slightly different size for visual parity */
    .fallback {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
  </style>

  <defs>
    <!-- subtle drop shadow -->
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- optional slight inner glow using a duplicate with lower opacity -->
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7CFFB8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00FF7F" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- background (transparent) -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- main text centered -->
  <g filter="url(#ds)">
    <text x="50%" y="50%" class="logo" text-anchor="middle" dominant-baseline="middle"
          style="fill: url(#g);">
      BurL AI
    </text>
  </g>

  <!-- invisible accessibility text for screen readers -->
  <title>BurL AI</title>
</svg>
